<style id="app-style">
/* Layout: arbeidsbenk i to kolonner — skjema til venstre, A4-forhåndsvisning som følger med til høyre; innstillingsskuff fra høyre kant (kun for de som kan redigere). Fargene kommer fra sidens oppsett og settes av skriptet. */
:root{
  --bg:#EEF1F6; --fg:#121826; --accent:#3346D3; --on-accent:#ffffff; --accent-ink:#3346D3;
  --surface:#FBFCFD; --soft:#E1E5EC; --line:#C3CAD6; --muted:#4F5869;
  --ok:#1F7A4D; --warn:#B4441A; --paper:#ffffff; --paper-ink:#111111; --mark:#FFE7A3;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sig:"Caveat","Segoe Script","Bradley Hand",cursive;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2.5px solid var(--accent-ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;font-weight:700;font-size:15px}
.brand img{height:34px;width:auto;max-width:180px;object-fit:contain;display:block}
.main{padding-block:clamp(28px,5vw,56px) 80px}
.intro{max-width:760px;margin-bottom:40px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(38px,6.5vw,68px);line-height:.96;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.intro p{margin:0;font-size:19px;color:var(--muted);max-width:62ch;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px;align-items:start}
.col{display:flex;flex-direction:column;gap:44px;min-width:0}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sh{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:10px}
.sh h2{margin:0;font-size:23px;font-weight:700;flex:1;text-wrap:balance}
.sh .meta{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.lbl{font-size:13px;font-weight:600}
.opt{font-weight:400;color:var(--muted)}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;font-size:16px;background:var(--surface);outline:none}
.in:focus{border-color:var(--accent-ink)}
textarea.in{resize:vertical;line-height:1.5}
.ro{padding:12px 14px;border:1.5px dashed var(--line);border-radius:6px;color:var(--muted);font-size:15px}
.seg{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;gap:4px;padding:4px;background:var(--soft);border-radius:9px}
.seg button{border:0;cursor:pointer;padding:11px 12px;border-radius:6px;font-size:15px;font-weight:600;background:transparent;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:8px 12px;font-size:13.5px}
.box{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--soft);border-radius:10px}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.btn{border:0;border-radius:7px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.line{background:transparent;border:1.5px solid var(--fg)}

.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.dash{background:transparent;border:1.5px dashed var(--line);align-self:flex-start}
.btn.dash:hover{border-color:var(--accent-ink)}
.btn.link{background:transparent;padding:11px 10px;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.self{align-self:flex-start}
.people{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) 44px;gap:8px;align-items:start;padding:6px;border-radius:8px}
.prow.sel{background:var(--soft)}
.prow .n{border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);height:44px;padding:0;font-variant-numeric:tabular-nums}

.pfs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;min-width:0}

.drop{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1.5px dashed var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;cursor:pointer}

.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.sigbox{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;height:170px;overflow:hidden;color:var(--paper-ink)}
.sigbox input{position:absolute;left:24px;right:24px;bottom:30px;border:0;outline:none;background:transparent;font-family:var(--sig);font-weight:600;font-size:52px;line-height:1.2;color:var(--paper-ink);padding:0;width:calc(100% - 48px)}
.sigbox canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigbox .base{position:absolute;left:24px;right:24px;bottom:36px;border-bottom:1px solid #C9CDD3;pointer-events:none}
.sigbox .cap{position:absolute;left:24px;bottom:12px;font-size:12px;color:#6B7280;pointer-events:none}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);display:flex;flex-direction:column;gap:14px;min-width:0}
.pvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pvname{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pvname b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:6px}
.pager button{width:44px;height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-size:18px}
.pager button:hover{border-color:var(--fg)}
.paper-wrap{container-type:inline-size;width:100%;max-width:560px}
.paper{aspect-ratio:210/297;max-width:100%;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 14px 40px rgba(0,0,0,.12);padding:7.1cqw 11.9cqw 0;display:flex;flex-direction:column;overflow:hidden;font-family:Helvetica,Arial,sans-serif}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:4cqw;min-height:9.5cqw}
.p-head img{max-width:26.2cqw;max-height:9.5cqw;object-fit:contain;object-position:left top;display:block}
.p-org{font-weight:700;font-size:3.1cqw}
.p-date{font-size:1.9cqw;color:#555;white-space:nowrap;padding-top:1cqw}
.p-title{margin-top:7.6cqw;font-size:2.35cqw;font-weight:700;line-height:1.2}
.p-body{margin-top:3.6cqw;font-size:1.93cqw;line-height:1.4;display:flex;flex-direction:column;gap:1.66cqw}

.p-sign{display:flex;flex-direction:column;margin-top:1cqw}
.p-sig{height:8.6cqw;display:flex;align-items:flex-end}
.p-sig span{font-family:var(--sig);font-weight:600;font-size:5.6cqw;line-height:1.1;white-space:nowrap}
.p-sig img{max-height:7.6cqw;max-width:31cqw;display:block}
mark{background:var(--mark);color:inherit;padding:0 .2em;border-radius:2px}
.mail{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;max-width:560px}
.mail dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;padding:14px 16px;border-bottom:1px solid var(--soft);font-size:14px}
.mail dt{color:var(--muted);font-weight:600}
.mail dd{margin:0;overflow-wrap:anywhere}
.mail pre{margin:0;padding:16px;font:inherit;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.att{display:flex;align-items:center;gap:10px;margin:0 16px 16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:600}
.att i{font-style:normal;font-size:11px;font-weight:800;background:var(--warn);color:#fff;border-radius:3px;padding:3px 5px}
.stack{display:flex;flex-direction:column;gap:10px;max-width:560px}
.note{font-size:14px;line-height:1.5;padding:12px 14px;background:var(--soft);border-radius:8px}
.note b{font-weight:700}
.note.warn{color:var(--warn);background:var(--surface);border:1.5px solid var(--warn)}
.note.ok{color:var(--ok);background:var(--surface);border:1.5px solid var(--ok)}
.send{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:16px 20px;font-size:17px;font-weight:700;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:12px}
.send[disabled]{opacity:.45;cursor:not-allowed}
.confirm{display:flex;flex-direction:column;gap:12px;padding:14px;border:2px solid var(--accent-ink);border-radius:10px;background:var(--surface);font-size:14.5px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.dls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.dls .btn{justify-content:space-between;font-size:14px;padding:12px 14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.list>button{border:0;background:transparent;cursor:pointer;padding:13px 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:12px;text-align:left}
.lrows{display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:360px;overflow:auto}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px;align-items:center;padding:6px 6px 6px 14px;border-bottom:1px solid var(--soft)}
.lrow b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.lrow small.ok{color:var(--ok)} .lrow small.warn{color:var(--warn)}
.lrow button{height:40px;padding:0 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-size:13px;font-weight:600}
.lrow button:hover{background:var(--soft)}
.foot{font-size:13px;color:var(--muted)}
/* Innstillingsskuff */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.22);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:21px;font-weight:800}
.db{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:34px}
.db section{gap:14px}
.db .sh h2{font-size:18px}
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.color{display:flex;flex-direction:column;gap:6px}
.color div{display:flex;gap:6px;align-items:center}
.color input[type=color]{width:46px;height:46px;border:1.5px solid var(--line);border-radius:6px;padding:3px;background:var(--surface);cursor:pointer;flex:none}
.color .in{padding:11px 10px;font-size:14px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.logo-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-pick .thumb{width:150px;height:64px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface);padding:6px;font-size:12px;color:var(--muted)}
.logo-pick .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--soft);border-radius:4px;padding:3px 6px}
.df{border-top:1px solid var(--line);padding:16px 22px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.df .acts{display:flex;gap:8px;flex-wrap:wrap}
.dirty{font-size:13px;font-weight:600;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script id="app-script">
(() => {
'use strict';
const CFG_EL = document.getElementById('site-config');
let cfg = JSON.parse(CFG_EL.textContent);
let savedJSON = JSON.stringify(cfg);
const IN_CLAUDE = !!window.claude;
const MONTHS = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const hasMail = p => EMAIL.test(((p && p.email) || '').trim());
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const fmtD = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return d + '. ' + MONTHS[m-1] + ' ' + y; };
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => { const ks = p.split('.'); let t = o; ks.slice(0,-1).forEach(k => { t = t[k] = t[k] || {}; }); t[ks[ks.length-1]] = v; };

/* ---------- Farger ---------- */
const hex = h => { h = String(h||'').trim().replace('#',''); if (h.length === 3) h = h.split('').map(c => c+c).join(''); return /^[0-9a-f]{6}$/i.test(h) ? h : null; };
const rgb = h => { h = hex(h) || '000000'; return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
const toHex = a => '#' + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return toHex(x.map((v,i) => v + (y[i]-v)*t)); };
const lum = h => { const [r,g,b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*r + .7152*g + .0722*b; };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
function applyTheme() {
  const c = cfg.colors, bg = '#' + (hex(c.bg) || 'EEF1F6'), fg = '#' + (hex(c.fg) || '121826'), ac = '#' + (hex(c.accent) || '3346D3');
  const dark = lum(bg) < .3, r = document.documentElement.style;
  const v = {
    '--bg': bg, '--fg': fg, '--accent': ac,
    '--on-accent': contrast(ac,'#ffffff') >= contrast(ac,'#111111') ? '#ffffff' : '#111111',
    '--accent-ink': contrast(ac, bg) >= 3 ? ac : fg,
    '--surface': dark ? mix(bg,'#ffffff',.07) : mix(bg,'#ffffff',.75),
    '--soft': mix(bg, fg, dark ? .12 : .07), '--line': mix(bg, fg, .22), '--muted': mix(fg, bg, .3),
    '--ok': dark ? '#5FD39A' : '#1F7A4D', '--warn': dark ? '#FF9B73' : '#B4441A', '--mark': dark ? '#7A5D10' : '#FFE7A3'
  };
  Object.keys(v).forEach(k => r.setProperty(k, v[k]));
  r.setProperty('color-scheme', dark ? 'dark' : 'light');
}

/* ---------- Skjematilstand (lagres bare i denne nettleseren) ---------- */
const KEY = 'fravaer-skjema-' + cfg.siteId;
const blank = () => ({ name: '', school: '', email: '' });
const base = () => ({ mode: 'past', ev: { arr: '', name: '', from: '', to: '', place: '' }, people: [blank()],
  att: { name: '', verv: '', phone: '', email: '', date: today(), sig: '' }, sigMode: 'text', sigImg: null,
  sel: 0, addMode: 'paste', bulk: '', imp: null, impHeader: true, showList: false, pv: 'pdf', confirming: false, sending: false, progress: '', msg: null, drawer: false });
let S = (() => { const b = base(); try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) return { ...b, ...s, ev: { ...b.ev, ...s.ev }, att: { ...b.att, ...s.att }, imp: null, confirming: false, sending: false, progress: '', msg: null, drawer: false, bulk: '' }; } catch (e) {} return b; })();
const persist = () => { try { const { imp, confirming, sending, progress, msg, drawer, bulk, ...rest } = S; localStorage.setItem(KEY, JSON.stringify(rest)); } catch (e) {} };

let canEdit = !IN_CLAUDE;

/* ---------- Innhold ---------- */

}
function missing() {
  const m = [];

  if (!S.ev.name.trim()) m.push('navn på arrangement');
  if (!S.ev.from.trim()) m.push('tidspunkt');

const fileName = p => (fill(cfg.pdf.fileName || 'Politisk fravær - {navn}', vars(p)).replace(/[\\/:*?"<>|]/g, '').trim() || 'Fravær') + '.pdf';
const markPh = s => esc(s).replace(/\[[^\]]+\]/g, m => '<mark>' + m + '</mark>');

/* ---------- Filer ---------- */
const abToB64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768)); return btoa(s); };
async function saveFile(name, data) {
  const dl = IN_CLAUDE ? await claude.use('downloads') : null;
  if (dl) {
    try { await dl.save({ filename: name, data }); return true; }
    catch (e) { if (e && e.code !== 'declined') flash('warn', 'Kunne ikke lagre filen (' + (e.code || 'ukjent feil') + ').'); return false; }
  }
  if (IN_CLAUDE) { flash('warn', 'Nedlasting er ikke tilgjengelig i denne visningen.'); return false; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}

/* ---------- PDF ---------- */
let SIG = null;
async function textSig() {
  const text = (S.att.sig || '').trim(); if (!text) return null;
  try { await document.fonts.load('600 160px Caveat'); } catch (e) {}
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  ctx.font = '600 160px Caveat, cursive'; const w = Math.ceil(ctx.measureText(text).width) + 40;
  c.width = w; c.height = 220; ctx.font = '600 160px Caveat, cursive'; ctx.fillStyle = '#111'; ctx.fillText(text, 20, 165);
  return { src: c.toDataURL('image/png'), w, h: 220 };
}
async function prepSig() { SIG = S.sigMode === 'draw' ? S.sigImg : await textSig(); }
const newPdf = () => new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
function drawPage(pdf, p) {
  const d = buildDoc(p), L = 25, R = 185, W = 160, top = 15;
  if (cfg.pdf.showLogo && cfg.logo && cfg.logoW) {
    let w = 55, h = w * cfg.logoH / cfg.logoW; if (h > 20) { h = 20; w = h * cfg.logoW / cfg.logoH; }
    try { pdf.addImage(cfg.logo, 'PNG', L, top, w, h); } catch (e) {}
  } else { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.setTextColor(0); pdf.text(cfg.orgName, L, top + 8); }
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.setTextColor(85); pdf.text(d.date, R, top + 5, { align: 'right' });
  pdf.setTextColor(0);
  let y = 52; pdf.setFont('helvetica', 'bold'); pdf.setFontSize(14); pdf.text(d.title, L, y);
  y += 10; pdf.setFont('helvetica', 'normal'); pdf.setFontSize(11.5);
  const lh = 11.5 * 0.3528 * 1.4;
  d.paras.forEach(t => {
    t.split('\n').forEach((line, li, arr) => {
      const lines = pdf.splitTextToSize(line, W);
      if (y + lines.length * lh > 282) { pdf.addPage(); y = 25; }
      pdf.text(lines, L, y, { lineHeightFactor: 1.4 }); y += lines.length * lh;
    });
    y += 3.6;
  });
  if (y > 240) { pdf.addPage(); y = 25; }
  pdf.text(d.greeting, L, y + 1);
  if (SIG && SIG.src) { const h0 = 16; let w = Math.min(65, h0 * SIG.w / SIG.h); const h = w * SIG.h / SIG.w; try { pdf.addImage(SIG.src, 'PNG', L, y + 3 + (h0 - h), w, h); } catch (e) {} }
  y += 25;
  pdf.text(d.signer, L, y); y += lh;
  if (d.role) { pdf.text(pdf.splitTextToSize(d.role, W), L, y); y += lh; }
  if (d.contact) pdf.text(pdf.splitTextToSize(d.contact, W), L, y);
}
function guard() {
  const m = missing(); if (m.length) { flash('warn', 'Fyll inn ' + m.join(', ') + ' først.'); return false; }
  if (!window.jspdf) { flash('warn', 'PDF-verktøyet laster fortsatt. Prøv igjen om et øyeblikk.'); return false; }
  return true;
}
async function dlOne(i) { const p = S.people[i]; if (!p || !p.name.trim() || !guard()) return; await prepSig(); const pdf = newPdf(); drawPage(pdf, p); saveFile(fileName(p), pdf.output('blob')); }
async function dlAll() { if (!guard()) return; await prepSig(); const pdf = newPdf(); valid().forEach((p, i) => { if (i) pdf.addPage(); drawPage(pdf, p); }); saveFile(fill(cfg.pdf.title, vars()) + ' - ' + S.ev.name.trim() + ' (samlet).pdf', pdf.output('blob')); }
async function dlZip() {
  if (!guard()) return; await prepSig(); const ppl = valid();
  if (ppl.length === 1 || !window.JSZip) { const pdf = newPdf(); drawPage(pdf, ppl[0]); return saveFile(fileName(ppl[0]), pdf.output('blob')); }
  const zip = new window.JSZip(), used = {};
  ppl.forEach(p => { const pdf = newPdf(); drawPage(pdf, p); let n = fileName(p); if (used[n]) n = n.replace(/\.pdf$/, ' (' + (++used[n]) + ').pdf'); else used[n] = 1; zip.file(n, pdf.output('arraybuffer')); });
  saveFile(S.ev.name.trim() + ' - fraværsskjemaer.zip', await zip.generateAsync({ type: 'blob' }));
}

/* ---------- E-post via Gmail ---------- */
const mailTargets = () => { const all = S.people.map((p, i) => ({ p, i })).filter(({ p }) => p.name.trim() && hasMail(p)); const unsent = all.filter(({ p }) => !p.sent); return { all, todo: unsent.length ? unsent : all, resend: !unsent.length && all.length > 0 }; };
function mailErr(e) {
  const c = e && e.code;
  if (c === 'server_not_connected' || c === 'selection_required' || c === 'server_not_found') return 'Gmail er ikke koblet til. Legg til Gmail under Innstillinger → Koblinger i claude.ai, og prøv igjen.';
  if (c === 'needs_reauth') return 'Gmail-tilkoblingen har gått ut. Koble til Gmail på nytt under Innstillinger → Koblinger i claude.ai.';
  if (c === 'not_in_manifest' || c === 'approval_required' || c === 'not_granted' || c === 'consent_required') return 'Siden fikk ikke lov til å bruke Gmail. Trykk Send igjen og godta tilgangen når Claude spør.';
  if (c === 'blocked_by_policy') return 'Organisasjonen din har sperret sending fra Gmail i Claude.';
  if (c === 'tool_error') return 'Gmail avviste e-posten: ' + (e.message || 'ukjent grunn') + '.';
  if (c === 'server_unavailable' || c === 'upstream_error') return 'Gmail svarte ikke. Sjekk Sendt-mappen før du prøver igjen, så ingen får e-posten to ganger.';
  return 'Utsendingen stoppet (' + (c || 'ukjent feil') + ').';
}
async function doSend() {
  const { todo } = mailTargets(); S.confirming = false;
  const mcp = IN_CLAUDE ? await claude.use('mcp') : null;
  if (!mcp) { S.msg = { kind: 'warn', text: 'E-postutsending virker bare når siden er åpnet i Claude og Gmail er koblet til. Last ned PDF-ene i stedet.' }; return renderSide(); }
  S.sending = true; S.msg = null; renderSide();
  await prepSig();
  const tool = cfg.mail.mode === 'draft' ? 'create_draft' : 'send_message';
  let done = 0, fail = null;
  for (const { p, i } of todo) {
    S.progress = (cfg.mail.mode === 'draft' ? 'Lager utkast ' : 'Sender ') + (done + 1) + ' av ' + todo.length + ' …'; renderSide();
    const pdf = newPdf(); drawPage(pdf, p);
    const v = vars(p);
    const input = { to: [p.email.trim()], subject: fill(cfg.mail.subject, v), body: fill(cfg.mail.body, v), attachments: [{ content: abToB64(pdf.output('arraybuffer')), filename: fileName(p), mimeType: 'application/pdf' }] };
    if (cfg.mail.ccSender && EMAIL.test((cfg.mail.fromEmail || '').trim())) input.cc = [cfg.mail.fromEmail.trim()];
    try { await mcp.callTool('Gmail', tool, input); S.people[i] = { ...S.people[i], sent: { at: new Date().toISOString(), mode: cfg.mail.mode } }; done++; persist(); }
    catch (e) { fail = e; break; }
  }
  S.sending = false; S.progress = '';
  const word = cfg.mail.mode === 'draft' ? 'utkast laget i Gmail' : 'e-poster sendt';
  if (fail) S.msg = { kind: 'warn', text: (done ? done + ' ' + word + '. ' : '') + mailErr(fail) };
  else S.msg = { kind: 'ok', text: done + ' ' + word + (cfg.mail.mode === 'draft' ? '. Åpne Utkast i Gmail for å sende dem.' : '.') };
  persist(); renderSide();
}

function setupPad() {
  const c = document.getElementById('pad'); if (!c) return;
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect(); if (!r.width) return;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const ctx = c.getContext('2d');
  const style = () => { ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineWidth = 2.6 * dpr; };
  style(); let drawing = false, last = null;
  const pos = e => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * dpr, (e.clientY - b.top) * dpr]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); last = pos(e); style(); ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, 7); ctx.fill(); };
  c.onpointermove = e => { if (!drawing) return; const q = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); last = q; };
  c.onpointerup = c.onpointercancel = () => { if (!drawing) return; drawing = false; saveSig(c); };
  if (S.sigImg) drawImg(c, S.sigImg.src, false);
}
function drawImg(c, src, save) {
  const img = new Image();
  img.onload = () => { const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); const pad = c.height * .12, k = Math.min((c.width - pad * 2) / img.width, c.height * .7 / img.height), w = img.width * k, h = img.height * k; ctx.drawImage(img, (c.width - w) / 2, c.height * .78 - h, w, h); if (save) saveSig(c); };
  img.src = src;
}
function saveSig(c) {
  const ctx = c.getContext('2d'), w = c.width, h = c.height, d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { S.sigImg = null; } else {
    const p = 6, cw = x1 - x0 + 1 + p * 2, ch = y1 - y0 + 1 + p * 2, out = document.createElement('canvas'); out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(c, x0 - p, y0 - p, cw, ch, 0, 0, cw, ch); S.sigImg = { src: out.toDataURL('image/png'), w: cw, h: ch };
  }
  const cap = document.getElementById('pad-cap'); if (cap) cap.textContent = S.sigImg ? 'Signatur lagret' : 'Signer her med mus eller finger';
  persist(); renderSide();
}

      const c = err && err.code;
      h.textContent = c === 'conflict' ? 'Noen andre lagret siden samtidig. Siden lastes inn på nytt med deres versjon, så endringene dine må gjøres igjen.'
        : (c === 'not_writer' || c === 'not_granted' || c === 'consent_required') ? 'Du har ikke redigeringstilgang til denne siden. Last ned som ny nettside i stedet.'
        : c === 'too_large' ? 'Siden ble for stor. Prøv en mindre logo.'
        : c === 'rate_limited' ? 'Du har lagret mange ganger på kort tid. Vent litt og prøv igjen.'
        : 'Lagringen feilet (' + (c || 'ukjent feil') + '). Prøv igjen om litt.';
      updateDrawerFoot();
    }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer) { S.drawer = false; renderDrawer(); } });

/* ---------- Bygg en komplett side av oppsettet ---------- */
function buildDocument(c) {
  const RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const css = document.getElementById('app-style').textContent, js = document.getElementById('app-script').textContent;
  const json = JSON.stringify(c).replace(/</g, '\\u003c');
  const S1 = '<scr' + 'ipt', S2 = '</scr' + 'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
    + '<title>' + esc(c.siteName || c.orgName || 'Politisk fravær') + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap">\n'
    + '<style id="app-style">' + css + '</style>\n<div id="app"><div id="page"></div><div id="drawer-root"></div></div>\n'
    + S1 + ' src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">' + S2 + '\n'
    + S1 + ' src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">' + S2 + '\n'
    + S1 + ' src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">' + S2 + '\n'
    + S1 + ' type="application/json" id="site-config">' + json + S2 + '\n'
    + S1 + ' id="app-script">' + js + S2 + '\n</body></html>';
}

/* ---------- Start ---------- */
applyTheme(); renderPage();
if (IN_CLAUDE) claude.use('user').then(async u => { if (!u) return; try { canEdit = !!(await Promise.resolve(u.canEdit())); } catch (e) { canEdit = false; } if (canEdit) renderPage(); }).catch(() => {});
})();
</script>
